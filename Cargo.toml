[workspace]
resolver = "2"
members = [
    ".",
]

[package]
name = "ccft"
version = "1.10.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/adiled/ccft"
readme = "README.md"
keywords = ["ccft", "agentic", "proxy", "ledger", "flytrap"]
categories = ["development-tools::debugging", "network-programming"]
description = "ccft - an agentic self improvement tool"

[lib]
name = "ccft"
path = "src/lib.rs"

[[bin]]
name = "ccft"
path = "src/main.rs"
required-features = ["bin"]

[features]
# core — pure math modules: ccft_brainrot, ccft_ledger, ccft_lex.
# No network, no TUI, no proxy machinery.
core = []
# sse — the hyper Body tap + session-id extraction (ccft_sse, ccft_session).
sse = ["dep:hyper", "dep:bytes", "dep:sha1", "dep:hex"]
# bin — the ccft executable: proxy, TUI, install/seed/lifecycle.
bin = ["sse",
  "dep:hudsucker",
  "dep:tokio",
  "dep:tracing-subscriber",
  "dep:http-body-util",
  "dep:hyper-util",
  "dep:rcgen",
  "dep:gethostname",
  "dep:once_cell",
  "dep:dashmap",
  "dep:clap",
  "dep:ratatui",
  "dep:crossterm",
]
default = ["core", "sse", "bin"]

[dependencies]
hudsucker = { version = "0.25", default-features = false, features = ["rcgen-ca", "rustls-client", "decoder"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"], optional = true }
rcgen = { version = "0.14", features = ["x509-parser", "pem"], optional = true }
time = { version = "0.3", features = ["local-offset", "macros", "parsing", "formatting"] }
serde_json = "1"
sha1 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
gethostname = { version = "1", optional = true }
once_cell = { version = "1", optional = true }
dashmap = { version = "6", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
