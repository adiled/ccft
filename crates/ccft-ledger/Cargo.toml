[package]
name = "ccft-ledger"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/adiled/ccft"
readme = "README.md"
keywords = ["ccft", "agentic", "proxy", "ledger", "flytrap"]
categories = ["development-tools::debugging", "network-programming"]
description = "Append/tail/range-read a growing JSONL ledger: TailReader, parse_range, percentile, coverage"

[dependencies]
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "macros", "parsing", "formatting"] }

[dev-dependencies]
tempfile = "3"
